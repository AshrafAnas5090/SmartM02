<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Money Analyzer Pro - V23.0-MICROSTRUCTURE</title>
<style>
:root {
  --bg: #070b10;
  --panel: #0d1219;
  --panel2: #0a1017;
  --border: #1a2533;
  --border-hover: #26364b;
  --text: #e2e8f0;
  --muted: #8b9bb0;
  --blue: #2f7df4;
  --green: #00e676;
  --red: #ff5252;
  --yellow: #ffd54f;
  --purple: #a78bfa;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(circle at 50% 0%, rgba(47,125,244,0.05), transparent 40%), var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  direction: ltr;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #26364b; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

.app {
  width: 99%;
  max-width: 1900px;
  margin: auto;
  padding: 15px 0 60px;
}

.top { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center;
  background: linear-gradient(135deg, #2f7df4, #00e676); font-weight: 900; font-size: 16px; color: #fff;
  box-shadow: 0 4px 15px rgba(47,125,244,0.3);
}
.sub { margin: 0; color: var(--muted); font-size: 12px; }
.range { padding: 6px 14px; border: 1px solid rgba(0,230,118,0.3); border-radius: 999px; color: var(--green); font-size: 11px; font-weight: 800; background: rgba(0,230,118,0.05); }

.search {
  display: flex; gap: 8px; padding: 10px; background: rgba(13,18,25,0.8);
  border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
input {
  flex: 1; height: 44px; padding: 0 16px; background: rgba(0,0,0,0.3);
  border: 1px solid var(--border); border-radius: 8px; color: #fff; outline: 0; font-size: 14px; font-weight: 600;
  transition: all 0.2s;
}
input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47,125,244,0.15); }

/* تأثيرات حركية دقيقة عند الضغط على الأزرار */
button { 
  cursor: pointer; 
  font: inherit; 
  font-weight: 800; 
  border-radius: 8px; 
  transition: transform 0.1s ease, background 0.2s, box-shadow 0.2s, filter 0.2s; 
}
button:active {
  transform: scale(0.96) translateY(1px) !important;
  filter: brightness(0.85);
}

.search-btn {
  min-width: 140px; border: 0; background: linear-gradient(135deg, #2f7df4, #1d62ca); color: #fff; font-size: 13px;
}
.search-btn:hover { background: linear-gradient(135deg, #3b86f5, #246bdb); transform: translateY(-1px); }

.status { min-height: 18px; margin: 0 5px 12px; font-size: 12px; font-weight: 600; }
.status.ok { color: var(--green); } .status.err { color: var(--red); }
.candle-meta{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:6px;font-size:10px;font-weight:800;white-space:nowrap;}
.candle-meta.ok{border:1px solid rgba(0,230,118,0.25);color:var(--green);background:rgba(0,230,118,0.04);}
.candle-meta.warn{border:1px solid rgba(255,213,79,0.28);color:var(--yellow);background:rgba(255,213,79,0.04);}
.candle-meta.err{border:1px solid rgba(255,82,82,0.28);color:#ffb8b5;background:rgba(255,82,82,0.04);}

.records { display: grid; gap: 15px; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 12px; background: rgba(13,20,28,.4); font-size: 14px; }

.record-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}
.record-header {
  display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
  background: rgba(255,255,255,0.015); border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px;
}
.symbol-title { font-size: 18px; font-weight: 900; margin: 0; letter-spacing: 0.5px; color: #fff; }
.header-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.small-btn { padding: 5px 10px; font-size: 11px; border: 1px solid var(--border); background: transparent; color: #cbd5e1; border-radius: 6px; }
.small-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; }
.small-btn:hover:not(:disabled) { background: rgba(255,255,255,0.05); }
.small-btn.fetch { border-color: rgba(47,125,244,0.4); color: #9fc5ff; }
.small-btn.del { border-color: rgba(255,82,82,0.4); color: #ffb8b5; }
.small-btn.gemini { border-color: rgba(167,139,250,0.4); color: #d8b4fe; background: rgba(167,139,250,0.05); }
.small-btn.gemini-compare { border-color: rgba(0,230,118,0.4); color: var(--green); background: rgba(0,230,118,0.05); }

.timer-control { display: inline-flex; align-items: center; gap: 4px; padding: 3px 6px; background: rgba(255,213,79,0.05); border: 1px solid rgba(255,213,79,0.2); border-radius: 6px; }
.timer-badge { color: var(--yellow); font-size: 11px; font-weight: 800; font-family: 'Consolas', monospace; min-width: 45px; text-align: center; }
.timer-badge.finished { color: var(--purple); }
.interval-select { background: transparent; color: var(--yellow); border: none; font-size: 10px; font-weight: 800; outline: 0; cursor: pointer; }

.table-container { overflow-x: auto; width: 100%; max-height: 600px; }
table.logs-table {
  width: 100%; border-collapse: collapse; min-width: 1700px; 
  text-align: center;
  font-family: 'Consolas', 'Menlo', monospace; font-size: 12px;
  font-variant-numeric: tabular-nums; 
}
th {
  position: sticky; top: 0; z-index: 10; 
  background: rgba(9, 15, 23, 0.95); backdrop-filter: blur(5px);
  color: var(--muted); padding: 10px 8px; font-size: 10px; text-transform: uppercase;
  border-bottom: 1px solid var(--border-hover); letter-spacing: 0.5px; white-space: nowrap;
  line-height: 1.4;
  vertical-align: middle;
}
td {
  padding: 6px 10px; 
  border-bottom: 1px solid rgba(255,255,255,0.03); color: #d1d5db; white-space: nowrap;
  vertical-align: middle;
}
td:nth-child(1), th:nth-child(1) { text-align: left; }

tr:last-child td { border-bottom: 0; }
tr:hover td { background: rgba(255,255,255,0.02); }

.up { color: var(--green)!important; font-weight: 700; }
.down { color: var(--red)!important; font-weight: 700; }
.buy { color: var(--green)!important; font-weight: 600; }
.sell { color: var(--red)!important; font-weight: 600; }
.pos { color: #69b4ff!important; }
.total-col { color: var(--yellow)!important; font-weight: 800; background: rgba(255,213,79,0.03); border-left: 1px solid rgba(255,255,255,0.02); border-right: 1px solid rgba(255,255,255,0.02); }

.actions-cell { display: flex; gap: 4px; justify-content: center; }
.row-btn { padding: 3px 6px; font-size: 10px; border-radius: 4px; border: 1px solid var(--border); background: rgba(255,255,255,0.02); color: var(--muted); transition: all 0.2s; }
.row-btn:hover { border-color: var(--red); color: var(--red); }

/* V23.0 — Microstructure retrieval identity */
.record-title-block{display:flex;flex-direction:column;gap:7px;min-width:0;flex:1;}
.market-strip{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:24px;}
.feed-badge{
  display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;
  font-family:'Consolas','Menlo',monospace;font-size:9px;font-weight:900;letter-spacing:.35px;
  border:1px solid var(--border);background:rgba(255,255,255,.025);color:var(--muted);
  white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(255,255,255,.01);
}
.feed-badge.ok{color:#82f7ba;border-color:rgba(0,230,118,.28);background:rgba(0,230,118,.07);box-shadow:0 0 14px rgba(0,230,118,.05);}
.feed-badge.warn{color:#ffe18a;border-color:rgba(255,213,79,.28);background:rgba(255,213,79,.06);}
.feed-badge.err{color:#ffaaa5;border-color:rgba(255,82,82,.32);background:rgba(255,82,82,.07);}
.feed-badge.purple{color:#dbc8ff;border-color:rgba(167,139,250,.32);background:rgba(167,139,250,.08);box-shadow:0 0 14px rgba(167,139,250,.05);}
.feed-badge.pulse::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:feedPulse 1.8s ease-out infinite;}
@keyframes feedPulse{0%{box-shadow:0 0 0 0 rgba(0,230,118,.45)}70%{box-shadow:0 0 0 6px rgba(0,230,118,0)}100%{box-shadow:0 0 0 0 rgba(0,230,118,0)}}
.row-data-badge{display:inline-block;padding:4px 7px;border-radius:6px;font-size:10px;font-weight:900;line-height:1.35;border:1px solid var(--border);background:rgba(255,255,255,.02);}
.row-data-badge.ok{color:#82f7ba;border-color:rgba(0,230,118,.2);background:rgba(0,230,118,.04);}
.row-data-badge.warn{color:#ffe18a;border-color:rgba(255,213,79,.2);background:rgba(255,213,79,.04);}
.row-data-badge.purple{color:#dbc8ff;border-color:rgba(167,139,250,.22);background:rgba(167,139,250,.05);}
.mini-detail{font-size:8px;font-weight:700;color:var(--muted);}
.micro-head{color:#82f7ba!important;background:linear-gradient(180deg,rgba(0,230,118,.045),rgba(9,15,23,.95))!important;}
.purple-text{color:#cdb7ff!important;background:linear-gradient(180deg,rgba(167,139,250,.05),rgba(9,15,23,.95))!important;}
.logs-table{min-width:1900px!important;}
@media(max-width:900px){.record-header{align-items:flex-start}.header-actions{width:100%}.feed-badge{font-size:8px}.market-strip{gap:4px}}

</style>

<body>
<div class="app">
<header class="top">
<div class="brand">
  <div class="logo">SM</div>
  <div><p class="sub">Binance Futures • SmartMoney + Live Microstructure (V23.0)</p></div>
</div>
<div class="range">VERIFIED DATA PIPELINE ACTIVE</div>
</header>

<section class="search">
<input id="coin" placeholder="Enter coin symbol e.g. BTC or 1000RATS..." autocomplete="off">
<button id="search" class="search-btn">SEARCH & LOG</button>
</section>
<div id="status" class="status">Ready</div>

<main id="records" class="records"></main>
</div>

<script>
"use strict";

/* ========================================================================
   SMART MONEY ANALYZER PRO — V23.0 MICROSTRUCTURE
   Architecture:
   - localStorage: lightweight application state / summaries
   - IndexedDB: full per-log market snapshots
   - RAM/WebSocket: live top-20 order book + observed liquidation feed
   ======================================================================== */
const KEY="smart_money_v22_4_pro"; // keep the existing key for backward compatibility
const DB_NAME="smart_money_market_v23";
const DB_VERSION=1;
const SNAPSHOT_STORE="snapshots";
const SM="https://www.binance.com/bapi/futures/v1/public";
const FUT="https://fapi.binance.com";
const WS_BASE="wss://fstream.binance.com/stream?streams=";
const DEFAULT_INTERVAL=30*60;
const LIQ_WINDOW_MS=30*60*1000;
const ORDERBOOK_LEVELS=20;
const LIVE_STALE_MS=5000;

let records=load();
const marketHubs=new Map();
const snapshotCache=new Map();
let dbPromise=null;

const coin=document.getElementById("coin"),
      search=document.getElementById("search"),
      status=document.getElementById("status"),
      recordsEl=document.getElementById("records");

/* ------------------------------ STORAGE -------------------------------- */
function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||"[]");
    const now=Math.floor(Date.now()/1000);
    return Array.isArray(x)?x.map(r=>({
      ...r,
      logs:(Array.isArray(r.logs)?r.logs:[]).map(log=>{
        const vm=log?.viewModel?{...log.viewModel}:{};
        // V22.4 fetched 5m candles but mislabeled candleMeta as 30m. Migrate that metadata safely.
        const migratedVmMeta=vm.candleMeta?{...vm.candleMeta,interval:"5m"}:vm.candleMeta;
        const migratedLogMeta=log?.candleMeta?{...log.candleMeta,interval:"5m"}:log?.candleMeta;
        return{...log,viewModel:{...vm,candleMeta:migratedVmMeta},candleMeta:migratedLogMeta};
      }),
      intervalSec:r.intervalSec||DEFAULT_INTERVAL,
      nextFetchTime:r.nextFetchTime||(now+(r.intervalSec||DEFAULT_INTERVAL)),
      fetchedDone:Boolean(r.fetchedDone)
    })):[];
  }catch(e){
    console.error("Local state load failed",e);
    return[];
  }
}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(records));
  }catch(e){
    console.error("Local state save failed",e);
    setStatus("Local state save failed. Historical heavy snapshots remain in IndexedDB.","err");
  }
}

function openMarketDB(){
  if(dbPromise)return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    if(!("indexedDB" in window)){
      reject(new Error("IndexedDB is not supported by this browser"));
      return;
    }
    const request=indexedDB.open(DB_NAME,DB_VERSION);
    request.onupgradeneeded=()=>{
      const db=request.result;
      if(!db.objectStoreNames.contains(SNAPSHOT_STORE)){
        const store=db.createObjectStore(SNAPSHOT_STORE,{keyPath:"id"});
        store.createIndex("symbol","symbol",{unique:false});
        store.createIndex("fetchedAt","fetchedAt",{unique:false});
      }
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error||new Error("IndexedDB open failed"));
  });
  return dbPromise;
}

async function putSnapshot(snapshot){
  const db=await openMarketDB();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(SNAPSHOT_STORE,"readwrite");
    tx.objectStore(SNAPSHOT_STORE).put(snapshot);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error||new Error("Snapshot write failed"));
    tx.onabort=()=>reject(tx.error||new Error("Snapshot write aborted"));
  });
  snapshotCache.set(snapshot.id,snapshot);
  return snapshot.id;
}

async function getSnapshot(id){
  if(!id)return null;
  if(snapshotCache.has(id))return snapshotCache.get(id);
  try{
    const db=await openMarketDB();
    const result=await new Promise((resolve,reject)=>{
      const tx=db.transaction(SNAPSHOT_STORE,"readonly");
      const req=tx.objectStore(SNAPSHOT_STORE).get(id);
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error||new Error("Snapshot read failed"));
    });
    if(result)snapshotCache.set(id,result);
    return result;
  }catch(e){
    console.error("Snapshot read failed",e);
    return null;
  }
}

async function deleteSnapshot(id){
  if(!id)return;
  snapshotCache.delete(id);
  try{
    const db=await openMarketDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(SNAPSHOT_STORE,"readwrite");
      tx.objectStore(SNAPSHOT_STORE).delete(id);
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error||new Error("Snapshot delete failed"));
    });
  }catch(e){console.warn("Snapshot delete skipped",e)}
}

async function deleteSnapshotsForRecord(record){
  if(!record?.logs)return;
  await Promise.all(record.logs.map(log=>deleteSnapshot(log.marketSnapshotId)));
}

/* ------------------------------- HELPERS -------------------------------- */
function setStatus(t,c=""){status.textContent=t;status.className="status"+(c?" "+c:"")}
function sym(v){v=String(v||"").trim().toUpperCase();if(!v)return"";return v.endsWith("USDT")?v:v+"USDT"}
function n(v){v=Number(v);return Number.isFinite(v)?v:0}
function finite(v){return Number.isFinite(Number(v))}
function compact(v){v=n(v);const a=Math.abs(v);if(a>=1e9)return(v/1e9).toFixed(2)+"B";if(a>=1e6)return(v/1e6).toFixed(2)+"M";if(a>=1e3)return(v/1e3).toFixed(2)+"K";return v.toFixed(2)}
function price(v){v=n(v);if(v>=100)return v.toFixed(2);if(v>=1)return v.toFixed(4);if(v>=.01)return v.toFixed(6);return v.toFixed(8)}
function pct(v){return n(v).toFixed(2)+"%"}
function nowIso(){return new Date().toISOString()}
function snapshotId(symbol){return `${symbol}:${Date.now()}:${Math.random().toString(36).slice(2,10)}`}
function escapeHtml(s){return String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
function median(values){
  const a=values.filter(Number.isFinite).sort((x,y)=>x-y);
  if(!a.length)return 0;
  const m=Math.floor(a.length/2);
  return a.length%2?a[m]:(a[m-1]+a[m])/2;
}
function formatAge(ms){
  if(!Number.isFinite(ms)||ms<0)return"--";
  if(ms<1000)return`${Math.round(ms)}ms`;
  if(ms<60000)return`${Math.round(ms/1000)}s`;
  return`${Math.round(ms/60000)}m`;
}
async function req(url){
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)throw new Error(`HTTP ${r.status} — ${url}`);
  return r.json();
}

/* -------------------------- LIVE MARKET HUB ----------------------------- */
function createHub(symbol){
  return{
    symbol,
    socket:null,
    reconnectTimer:null,
    reconnectAttempts:0,
    connected:false,
    startedAt:Date.now(),
    connectedAt:null,
    lastWsAt:0,
    lastError:"",
    depth:null,
    bookTicker:null,
    liquidationEvents:[]
  };
}

function ensureMarketStream(symbol){
  let hub=marketHubs.get(symbol);
  if(!hub){
    hub=createHub(symbol);
    marketHubs.set(symbol,hub);
    connectMarketStream(hub);
  }else if(!hub.socket && !hub.reconnectTimer){
    connectMarketStream(hub);
  }
  return hub;
}

function connectMarketStream(hub){
  if(!hub||hub.socket)return;
  const lower=hub.symbol.toLowerCase();
  const streams=[`${lower}@depth20@100ms`,`${lower}@bookTicker`,`${lower}@forceOrder`].join("/");
  let socket;
  try{socket=new WebSocket(WS_BASE+streams)}catch(e){scheduleReconnect(hub,e);return}
  hub.socket=socket;

  socket.onopen=()=>{
    hub.connected=true;
    hub.connectedAt=Date.now();
    hub.reconnectAttempts=0;
    hub.lastError="";
    updateFeedBadges();
  };

  socket.onmessage=event=>{
    hub.lastWsAt=Date.now();
    try{
      const packet=JSON.parse(event.data);
      const data=packet?.data||packet;
      if(!data)return;
      if(data.e==="depthUpdate"){
        hub.depth={
          eventTime:n(data.E),
          transactionTime:n(data.T),
          firstUpdateId:n(data.U),
          finalUpdateId:n(data.u),
          previousFinalUpdateId:n(data.pu),
          bids:Array.isArray(data.b)?data.b:[],
          asks:Array.isArray(data.a)?data.a:[],
          receivedAt:Date.now(),
          source:"BINANCE_WS_PARTIAL_DEPTH_20_100MS"
        };
      }else if(data.e==="bookTicker"){
        hub.bookTicker={
          eventTime:n(data.E),
          transactionTime:n(data.T),
          updateId:n(data.u),
          bestBid:n(data.b),
          bestBidQty:n(data.B),
          bestAsk:n(data.a),
          bestAskQty:n(data.A),
          receivedAt:Date.now(),
          source:"BINANCE_WS_BOOK_TICKER"
        };
      }else if(data.e==="forceOrder"&&data.o){
        const o=data.o;
        const orderSide=String(o.S||"").toUpperCase();
        const liquidationSide=orderSide==="SELL"?"LONG":orderSide==="BUY"?"SHORT":"UNKNOWN";
        const eventPrice=n(o.ap)>0?n(o.ap):n(o.p);
        const filledQty=n(o.z)>0?n(o.z):n(o.q);
        const evt={
          eventTime:n(data.E)||Date.now(),
          transactionTime:n(o.T)||n(data.E)||Date.now(),
          symbol:String(o.s||hub.symbol),
          orderSide,
          liquidationSide,
          orderType:String(o.o||""),
          timeInForce:String(o.f||""),
          originalQty:n(o.q),
          price:n(o.p),
          averagePrice:n(o.ap),
          lastFilledQty:n(o.l),
          filledQty,
          status:String(o.X||""),
          observedPrice:eventPrice,
          observedNotionalUSDT:eventPrice*filledQty,
          receivedAt:Date.now()
        };
        hub.liquidationEvents.push(evt);
        pruneLiquidations(hub);
      }
    }catch(e){console.warn("WS message parse failed",hub.symbol,e)}
  };

  socket.onerror=()=>{hub.lastError="WebSocket error"};
  socket.onclose=()=>{
    hub.connected=false;
    hub.socket=null;
    updateFeedBadges();
    if(records.some(r=>r.symbol===hub.symbol))scheduleReconnect(hub);
  };
}

function scheduleReconnect(hub,error){
  if(!hub||hub.reconnectTimer)return;
  hub.connected=false;
  hub.socket=null;
  hub.lastError=error?.message||hub.lastError||"Disconnected";
  const delay=Math.min(30000,1000*Math.pow(2,Math.min(hub.reconnectAttempts,5)));
  hub.reconnectAttempts++;
  hub.reconnectTimer=setTimeout(()=>{
    hub.reconnectTimer=null;
    if(records.some(r=>r.symbol===hub.symbol))connectMarketStream(hub);
  },delay);
}

function stopMarketStream(symbol){
  const hub=marketHubs.get(symbol);
  if(!hub)return;
  if(hub.reconnectTimer)clearTimeout(hub.reconnectTimer);
  hub.reconnectTimer=null;
  try{if(hub.socket)hub.socket.close()}catch{}
  hub.socket=null;
  hub.connected=false;
  marketHubs.delete(symbol);
}

function pruneLiquidations(hub){
  const cutoff=Date.now()-LIQ_WINDOW_MS;
  hub.liquidationEvents=hub.liquidationEvents.filter(e=>(e.eventTime||e.receivedAt)>=cutoff);
}

/* ---------------------- MICROSTRUCTURE ANALYTICS ------------------------ */
function normalizeLevels(levels,side){
  const out=(Array.isArray(levels)?levels:[])
    .filter(x=>Array.isArray(x)&&x.length>=2&&finite(x[0])&&finite(x[1])&&n(x[0])>0&&n(x[1])>=0)
    .map(x=>({price:n(x[0]),qty:n(x[1]),notionalUSDT:n(x[0])*n(x[1])}))
    .filter(x=>x.qty>0);
  out.sort((a,b)=>side==="bid"?b.price-a.price:a.price-b.price);
  return out.slice(0,ORDERBOOK_LEVELS);
}

function wallCandidates(levels){
  if(!levels.length)return[];
  const med=median(levels.map(x=>x.notionalUSDT));
  return[...levels]
    .sort((a,b)=>b.notionalUSDT-a.notionalUSDT)
    .slice(0,3)
    .map(x=>({
      ...x,
      strengthVsMedian:med>0?x.notionalUSDT/med:0
    }));
}

function analyzeOrderBook(raw,current,bookTicker=null){
  const bids=normalizeLevels(raw?.bids||raw?.b||[],"bid");
  const asks=normalizeLevels(raw?.asks||raw?.a||[],"ask");
  const bestBid=bookTicker?.bestBid>0?bookTicker.bestBid:(bids[0]?.price||0);
  const bestAsk=bookTicker?.bestAsk>0?bookTicker.bestAsk:(asks[0]?.price||0);
  const midPrice=bestBid>0&&bestAsk>0?(bestBid+bestAsk)/2:n(current);
  const spread=bestAsk>0&&bestBid>0?bestAsk-bestBid:0;
  const spreadBps=midPrice>0?(spread/midPrice)*10000:0;
  const bidDepthUSDT=bids.reduce((s,x)=>s+x.notionalUSDT,0);
  const askDepthUSDT=asks.reduce((s,x)=>s+x.notionalUSDT,0);
  const totalDepth=bidDepthUSDT+askDepthUSDT;
  const imbalancePct=totalDepth>0?((bidDepthUSDT-askDepthUSDT)/totalDepth)*100:0;
  const capturedAt=Date.now();
  const dataOk=bids.length>=5&&asks.length>=5&&bestBid>0&&bestAsk>0;
  const source=raw?.source||"BINANCE_REST_DEPTH";
  return{
    status:dataOk?"READY":"NOT_AVAILABLE",
    source,
    capturedAt,
    eventTime:n(raw?.eventTime||raw?.E)||null,
    transactionTime:n(raw?.transactionTime||raw?.T)||null,
    updateId:n(raw?.finalUpdateId||raw?.lastUpdateId||raw?.u)||null,
    levelsRequested:ORDERBOOK_LEVELS,
    bidsLoaded:bids.length,
    asksLoaded:asks.length,
    bestBid,
    bestAsk,
    bestBidQty:bookTicker?.bestBidQty||bids[0]?.qty||0,
    bestAskQty:bookTicker?.bestAskQty||asks[0]?.qty||0,
    midPrice,
    spread,
    spreadBps,
    bidDepthUSDT,
    askDepthUSDT,
    imbalancePct,
    bidWalls:wallCandidates(bids),
    askWalls:wallCandidates(asks),
    bids,
    asks,
    bookTicker:bookTicker?{...bookTicker}:null
  };
}

function clusterLiquidations(events,currentPrice,side){
  const filtered=events.filter(e=>e.liquidationSide===side&&e.observedPrice>0&&e.observedNotionalUSDT>=0);
  if(!filtered.length||currentPrice<=0)return[];
  const bucketSize=Math.max(currentPrice*0.001,Number.EPSILON); // 0.10% price buckets, derived not predicted
  const map=new Map();
  for(const e of filtered){
    const bucket=Math.round(e.observedPrice/bucketSize)*bucketSize;
    const key=bucket.toFixed(12);
    const c=map.get(key)||{side,price:bucket,eventCount:0,observedNotionalUSDT:0,qty:0,firstEventTime:e.eventTime,lastEventTime:e.eventTime};
    c.eventCount++;
    c.observedNotionalUSDT+=e.observedNotionalUSDT;
    c.qty+=e.filledQty;
    c.firstEventTime=Math.min(c.firstEventTime,e.eventTime);
    c.lastEventTime=Math.max(c.lastEventTime,e.eventTime);
    map.set(key,c);
  }
  return[...map.values()]
    .map(c=>({...c,distancePct:currentPrice>0?((c.price-currentPrice)/currentPrice)*100:0}))
    .sort((a,b)=>b.observedNotionalUSDT-a.observedNotionalUSDT);
}

function analyzeLiquidations(hub,currentPrice){
  pruneLiquidations(hub);
  const now=Date.now();
  const events=hub.liquidationEvents.map(e=>({...e})).sort((a,b)=>a.eventTime-b.eventTime);
  const longs=events.filter(e=>e.liquidationSide==="LONG");
  const shorts=events.filter(e=>e.liquidationSide==="SHORT");
  const longUSDT=longs.reduce((s,e)=>s+e.observedNotionalUSDT,0);
  const shortUSDT=shorts.reduce((s,e)=>s+e.observedNotionalUSDT,0);
  const totalUSDT=longUSDT+shortUSDT;
  const feedFresh=hub.connected&&(now-hub.lastWsAt)<10000;
  const coverageStart=Math.max(hub.startedAt,now-LIQ_WINDOW_MS);
  const longClusters=clusterLiquidations(events,currentPrice,"LONG");
  const shortClusters=clusterLiquidations(events,currentPrice,"SHORT");
  return{
    status:feedFresh?(events.length?"STREAM_ACTIVE":"STREAM_ACTIVE_NO_EVENTS"):"NOT_AVAILABLE",
    source:"BINANCE_WS_FORCE_ORDER_OBSERVED",
    capturedAt:now,
    requestedWindowMinutes:30,
    coverageStart,
    coverageMinutes:Math.max(0,(now-coverageStart)/60000),
    streamConnected:hub.connected,
    lastWsAt:hub.lastWsAt||null,
    eventCount:events.length,
    longEventCount:longs.length,
    shortEventCount:shorts.length,
    longLiquidationUSDT:longUSDT,
    shortLiquidationUSDT:shortUSDT,
    totalLiquidationUSDT:totalUSDT,
    longSharePct:totalUSDT>0?(longUSDT/totalUSDT)*100:0,
    shortSharePct:totalUSDT>0?(shortUSDT/totalUSDT)*100:0,
    netObservedPressureUSDT:shortUSDT-longUSDT,
    longClusters,
    shortClusters,
    events
  };
}

function marketStatus(symbol){
  const hub=marketHubs.get(symbol);
  const now=Date.now();
  if(!hub)return{connected:false,bookReady:false,bookAge:null,liqReady:false,liqEvents:0,liqCoverage:0};
  const depthFresh=hub.depth&&(now-hub.depth.receivedAt)<LIVE_STALE_MS;
  const bookFresh=hub.bookTicker&&(now-hub.bookTicker.receivedAt)<LIVE_STALE_MS;
  pruneLiquidations(hub);
  return{
    connected:hub.connected,
    bookReady:Boolean(depthFresh&&bookFresh),
    bookAge:depthFresh?now-hub.depth.receivedAt:null,
    liqReady:Boolean(hub.connected&&(now-hub.lastWsAt)<10000),
    liqEvents:hub.liquidationEvents.length,
    liqCoverage:Math.max(0,(now-hub.startedAt)/60000),
    lastError:hub.lastError
  };
}

async function captureAndStoreMarketSnapshot(symbol,current,restDepth){
  const hub=ensureMarketStream(symbol);
  const now=Date.now();
  const liveDepthFresh=hub.depth&&(now-hub.depth.receivedAt)<LIVE_STALE_MS;
  const depthRaw=liveDepthFresh?hub.depth:{...restDepth,source:"BINANCE_REST_DEPTH"};
  const bookTicker=hub.bookTicker&&(now-hub.bookTicker.receivedAt)<LIVE_STALE_MS?hub.bookTicker:null;
  const orderBook=analyzeOrderBook(depthRaw,current,bookTicker);
  const liquidations=analyzeLiquidations(hub,current);
  const snapshot={
    id:snapshotId(symbol),
    schemaVersion:1,
    symbol,
    fetchedAt:Date.now(),
    orderBook,
    liquidations
  };
  await putSnapshot(snapshot);
  return snapshot;
}

async function fetchData(symbol){
  ensureMarketStream(symbol);
  const urls=[
    SM+"/future/smart-money/signal/overview?symbol="+encodeURIComponent(symbol),
    SM+"/future/smart-money/signal/details/stats?symbol="+encodeURIComponent(symbol)+"&timeRange=30m",
    FUT+"/fapi/v1/ticker/price?symbol="+encodeURIComponent(symbol),
    FUT+"/fapi/v1/ticker/24hr?symbol="+encodeURIComponent(symbol),
    FUT+"/fapi/v1/openInterest?symbol="+encodeURIComponent(symbol),
    FUT+"/fapi/v1/premiumIndex?symbol="+encodeURIComponent(symbol),
    FUT+"/fapi/v1/klines?symbol="+encodeURIComponent(symbol)+"&interval=5m&limit=100",
    FUT+"/fapi/v1/depth?symbol="+encodeURIComponent(symbol)+"&limit=20"
  ];
  const [overview,stats30,priceData,volume,oi,funding,candles,restDepth]=await Promise.all(urls.map(req));
  if(!Array.isArray(candles))throw new Error("Candles response is not an array");
  if(!restDepth||!Array.isArray(restDepth.bids)||!Array.isArray(restDepth.asks))throw new Error("Order book response is invalid");
  const validCandles=candles.filter(c=>Array.isArray(c)&&c.length>=6&&[0,1,2,3,4,5].every(i=>Number.isFinite(Number(c[i]))));
  const candleMeta={
    interval:"5m",
    requested:100,
    loaded:candles.length,
    valid:validCandles.length,
    firstTime:candles[0]?.[0]||null,
    lastTime:candles[candles.length-1]?.[0]||null,
    loadedOk:candles.length===100&&validCandles.length===100
  };
  const candleData=validCandles.map(c=>({time:Number(c[0]),open:Number(c[1]),high:Number(c[2]),low:Number(c[3]),close:Number(c[4]),volume:Number(c[5])}));
  return{symbol,overview,stats30,price:priceData,volume,openInterest:oi,funding,candles:candleData,candleMeta,restDepth,fetchedAt:Date.now()};
}

function model(d){
  const o=d.overview?.data||{},s=d.stats30?.data||{};
  const current=n(d.price?.price),volume=n(d.volume?.quoteVolume);
  const priceChangePct=n(d.volume?.priceChangePercent);
  const oiQty=n(d.openInterest?.openInterest),oiUSDT=oiQty*current;
  const funding=n(d.funding?.lastFundingRate)*100;

  const longTraders=o.longTraders??o.longTradersCount??0;
  const shortTraders=o.shortTraders??o.shortTradersCount??0;
  const longEntry=price(o.longTradersAvgEntryPrice||0);
  const shortEntry=price(o.shortTradersAvgEntryPrice||0);
  const longProfitTraders=o.longProfitTraders??0;
  const shortProfitTraders=o.shortProfitTraders??0;
  const longProfitPct=n(longTraders)>0?(n(longProfitTraders)/n(longTraders))*100:0;
  const shortProfitPct=n(shortTraders)>0?(n(shortProfitTraders)/n(shortTraders))*100:0;

  const longTradersQty=n(o.longTradersQty||0),shortTradersQty=n(o.shortTradersQty||0);
  const longTradersUSDT=longTradersQty*current,shortTradersUSDT=shortTradersQty*current;
  const totalTradersUSDT=longTradersUSDT+shortTradersUSDT;

  const longWhales=o.longWhales??o.longWhalesCount??0;
  const shortWhales=o.shortWhales??o.shortWhalesCount??0;
  const longWhaleEntry=price(o.longWhalesAvgEntryPrice||0);
  const shortWhaleEntry=price(o.shortWhalesAvgEntryPrice||0);
  const longProfitWhales=o.longProfitWhales??0;
  const shortProfitWhales=o.shortProfitWhales??0;
  const longWhaleProfitPct=n(longWhales)>0?(n(longProfitWhales)/n(longWhales))*100:0;
  const shortWhaleProfitPct=n(shortWhales)>0?(n(shortProfitWhales)/n(shortWhales))*100:0;

  const longWhalesQty=n(o.longWhalesQty||0),shortWhalesQty=n(o.shortWhalesQty||0);
  const longWhalesUSDT=longWhalesQty*current,shortWhalesUSDT=shortWhalesQty*current;
  const totalWhalesUSDT=longWhalesUSDT+shortWhalesUSDT;

  return{
    current,volume,priceChangePct,oiUSDT,funding,
    longTraders,shortTraders,
    totalTradersPos:compact(totalTradersUSDT),
    longTradersPos:compact(longTradersUSDT),shortTradersPos:compact(shortTradersUSDT),
    longEntry,shortEntry,longProfitTraders,shortProfitTraders,
    longProfitPct:pct(longProfitPct),shortProfitPct:pct(shortProfitPct),
    longWhales,shortWhales,
    totalWhalesPos:compact(totalWhalesUSDT),
    longWhalesPos:compact(longWhalesUSDT),shortWhalesPos:compact(shortWhalesUSDT),
    longWhaleEntry,shortWhaleEntry,longProfitWhales,shortProfitWhales,
    longWhaleProfitPct:pct(longWhaleProfitPct),shortWhaleProfitPct:pct(shortWhaleProfitPct),
    l30Traders:`L ${s.longTraders??"-"} | S ${s.shortTraders??"-"}`,
    l30Whales:`L ${s.longWhales??"-"} | S ${s.shortWhales??"-"}`,
    l30Pos:`L ${compact(s.longPositions)} | S ${compact(s.shortPositions)}`,
    l30Qty:`L ${compact(s.longQty)} | S ${compact(s.shortQty)}`,
    candleMeta:d.candleMeta||{interval:"5m",requested:100,loaded:0,valid:0,loadedOk:false},
    candles:Array.isArray(d.candles)?d.candles:[]
  };
}

function snapshotSummary(snapshot){
  const ob=snapshot?.orderBook||{};
  const liq=snapshot?.liquidations||{};
  return{
    orderBook:{
      status:ob.status||"NOT_AVAILABLE",
      source:ob.source||"NOT_AVAILABLE",
      bidsLoaded:ob.bidsLoaded||0,
      asksLoaded:ob.asksLoaded||0,
      spreadBps:n(ob.spreadBps),
      imbalancePct:n(ob.imbalancePct),
      capturedAt:ob.capturedAt||null
    },
    liquidations:{
      status:liq.status||"NOT_AVAILABLE",
      source:liq.source||"NOT_AVAILABLE",
      eventCount:liq.eventCount||0,
      longLiquidationUSDT:n(liq.longLiquidationUSDT),
      shortLiquidationUSDT:n(liq.shortLiquidationUSDT),
      coverageMinutes:n(liq.coverageMinutes),
      capturedAt:liq.capturedAt||null
    }
  };
}

async function buildLogEntry(symbol,data){
  const vm=model(data);
  let snapshot=null;
  let snapshotError=null;
  try{
    snapshot=await captureAndStoreMarketSnapshot(symbol,vm.current,data.restDepth);
  }catch(e){
    console.error("Market snapshot persistence failed",e);
    snapshotError=e.message;
    // Order book still has a reliable REST fallback for the visible log summary.
    const hub=ensureMarketStream(symbol);
    snapshot={
      id:null,schemaVersion:1,symbol,fetchedAt:Date.now(),
      orderBook:analyzeOrderBook({...data.restDepth,source:"BINANCE_REST_DEPTH"},vm.current,hub.bookTicker),
      liquidations:analyzeLiquidations(hub,vm.current)
    };
  }
  return{
    viewModel:vm,
    candleMeta:vm.candleMeta||null,
    fetchedAt:Date.now(),
    marketSnapshotId:snapshot.id||null,
    marketSummary:snapshotSummary(snapshot),
    marketSnapshotError:snapshotError
  };
}

function changeInterval(symbol,minsVal){
  const r=records.find(x=>x.symbol===symbol);
  if(!r)return;
  const newSec=parseInt(minsVal,10)*60;
  r.intervalSec=newSec;
  r.nextFetchTime=Math.floor(Date.now()/1000)+newSec;

async function searchCoin(){
  const symbol=sym(coin.value);
  if(!symbol){setStatus("Please enter a valid coin symbol.","err");return}
  search.disabled=true;
  ensureMarketStream(symbol);
  setStatus(`Fetching SmartMoney + price + 5m candles + order book for ${symbol}...`);
  try{
    const data=await fetchData(symbol);
    const logEntry=await buildLogEntry(symbol,data);
    let existing=records.find(x=>x.symbol===symbol);
    const now=Math.floor(Date.now()/1000);
    if(existing){
      existing.logs.unshift(logEntry);
      const interval=existing.intervalSec||DEFAULT_INTERVAL;
      existing.nextFetchTime=now+interval;
      existing.fetchedDone=false;
    }else{
      records.unshift({symbol,logs:[logEntry],intervalSec:DEFAULT_INTERVAL,nextFetchTime:now+DEFAULT_INTERVAL,fetchedDone:false});
    }
    save();render();coin.value="";
    const cm=logEntry.viewModel.candleMeta;
    const ob=logEntry.marketSummary?.orderBook;
    const liq=logEntry.marketSummary?.liquidations;
    setStatus(`${symbol} complete snapshot saved. Candles ${cm.loaded}/${cm.requested} ✓ • Order Book ${ob?.status==='READY'?'✓':'⚠'} • Liquidation feed ${liq?.status?.startsWith('STREAM_ACTIVE')?'✓':'warming up'}.`,ob?.status==='READY'?"ok":"err");
  }catch(e){
    console.error(e);
    if(!records.some(r=>r.symbol===symbol))stopMarketStream(symbol);
    setStatus(`Failed to load ${symbol}: ${e.message}`,"err");
  }finally{search.disabled=false}
}

async function resetAndFetch(symbol){
  ensureMarketStream(symbol);
  setStatus(`Fetching complete new snapshot for ${symbol}...`);
  try{
    const data=await fetchData(symbol);
    const logEntry=await buildLogEntry(symbol,data);
    const existing=records.find(x=>x.symbol===symbol);
    const now=Math.floor(Date.now()/1000);
    if(existing){
      existing.logs.unshift(logEntry);
      existing.nextFetchTime=now+(existing.intervalSec||DEFAULT_INTERVAL);
      existing.fetchedDone=false;
      save();render();
      const ob=logEntry.marketSummary?.orderBook;
      const liq=logEntry.marketSummary?.liquidations;
      setStatus(`New complete log saved for ${symbol}. ORDER BOOK ${ob?.status==='READY'?'✓':'⚠'} • LIQUIDATIONS ${liq?.status?.startsWith('STREAM_ACTIVE')?'✓':'warming up'}.`,"ok");
    }
  }catch(e){console.error(e);setStatus(`Failed: ${e.message}`,"err")}
}

async function deleteLog(symbol,idx){
  if(!confirm("Delete this log row?"))return;
  const r=records.find(x=>x.symbol===symbol);
  if(!r)return;
  const [removed]=r.logs.splice(idx,1);
  if(removed?.marketSnapshotId)deleteSnapshot(removed.marketSnapshotId);
  if(!r.logs.length){records=records.filter(x=>x.symbol!==symbol);stopMarketStream(symbol)}
  save();render();setStatus("Log row deleted.","ok");
}

async function delCoin(symbol){
  if(!confirm(`Delete all logs for ${symbol}?`))return;
  const record=records.find(x=>x.symbol===symbol);
  records=records.filter(x=>x.symbol!==symbol);
  stopMarketStream(symbol);
  save();render();
  if(record)deleteSnapshotsForRecord(record);
  setStatus(`${symbol} deleted.`,"ok");
}

async function copyPromptToClipboard(text){
  if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return}
  const ta=document.createElement("textarea");
  ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.left="-9999px";ta.style.top="0";
  document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
  const ok=document.execCommand("copy");document.body.removeChild(ta);
  if(!ok)throw new Error("Clipboard access is blocked by the browser");
}

setInterval(()=>{

  records.forEach(r=>{
    const interval=r.intervalSec||DEFAULT_INTERVAL;
    if(!r.nextFetchTime)r.nextFetchTime=now+interval;

      r.fetchedDone=true;
      fetchData(r.symbol)
        .then(data=>buildLogEntry(r.symbol,data))
        .then(logEntry=>{
          r.logs.unshift(logEntry);
          r.nextFetchTime=Math.floor(Date.now()/1000)+(r.intervalSec||DEFAULT_INTERVAL);
          r.fetchedDone=false;
          save();render();
        })
        .catch(err=>{
          console.error("Auto fetch error for",r.symbol,err);
          r.fetchedDone=false;
          r.nextFetchTime=Math.floor(Date.now()/1000)+15;
        });
    }else if(!r.fetchedDone){
      const badge=document.getElementById(`timer-${r.symbol}`);
      if(badge){
        const timeLeft=Math.max(0,r.nextFetchTime-now);
        badge.textContent=`⏱ ${String(Math.floor(timeLeft/60)).padStart(2,"0")}:${String(timeLeft%60).padStart(2,"0")}`;

    }
